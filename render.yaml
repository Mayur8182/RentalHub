services:
  # ─── BACKEND API (Web Service) ────────────────────────────────────────
  - type: web
    name: rentalhub-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://rentalhub-frontend.onrender.com

  # ─── FRONTEND (Static Site) ───────────────────────────────────────────
  - type: web
    name: rentalhub-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://rentalhub-backend-kkv3.onrender.com
